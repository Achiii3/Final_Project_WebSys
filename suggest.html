<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Suggest a Spot — StudySpot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Cropper CSS -->
  <link rel="stylesheet" href="https://unpkg.com/cropperjs/dist/cropper.min.css">

  <!-- Page CSS -->
  <link rel="stylesheet" href="suggest.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="image/StudySpot.png" alt="StudySpot logo">
      <div class="brand">StudySpot</div>
    </div>

    <nav>
      <a href="Index.html">Home</a>
      <a href="Spots.html">Spots</a>
      <a href="Suggest.html" class="active">Suggest</a>
      <a href="About.html">About</a>
    </nav>

    <div class="user-icon"><img src="image/user.png" alt="User" style="height:44px;border-radius:50%"></div>
  </header>

  <main>
    <section class="card" id="formCard">
      <h1>Suggest a New Study Spot</h1>
      <p class="lead">Help others discover great places to study.</p>

      <form id="suggestForm" novalidate>
        <div class="row">
          <div class="col-2">
            <label for="placeName">Name of the Place</label>
            <input id="placeName" name="placeName" type="text" placeholder="Ex. Green Bean Café" required>
          </div>
          <div class="col-2">
            <label for="location">Location</label>
            <input id="location" name="location" type="text" placeholder="Ex. College St., City" required>
          </div>
        </div>

        <div class="row">
          <div style="flex:1 1 100%">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe the place..."></textarea>
          </div>
        </div>

        <div class="row">
          <div class="col-3">
            <label>Tags (Select all that apply)</label>
            <div class="tags-grid" role="group" aria-label="Tags">
              <label class="tag-checkbox"><input type="checkbox" name="tags" value="Quiet">Quiet</label>
              <label class="tag-checkbox"><input type="checkbox" name="tags" value="Wi‑Fi">Wi‑Fi</label>
              <label class="tag-checkbox"><input type="checkbox" name="tags" value="Safe">Safe</label>
              <label class="tag-checkbox"><input type="checkbox" name="tags" value="Affordable">Affordable</label>
            </div>
          </div>

          <div class="col-3">
            <label>Safety Level</label>
            <div class="safety-row" role="radiogroup" aria-label="Safety level">
              <label><input type="radio" name="safety" value="Safe" checked>Safe</label>
              <label><input type="radio" name="safety" value="Moderate">Moderate</label>
              <label><input type="radio" name="safety" value="Risky">Risky</label>
            </div>
          </div>

          <div class="col-3">
            <label for="photo">Photo (Optional)</label>

            <label class="upload-box" for="photo" role="button" aria-label="Upload image">
              <div class="upload-icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M12 3v10" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M8 7l4-4 4 4" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>

              <div class="upload-meta">
                <div class="title">Upload Image</div>
                <div class="hint">Optional — add a photo to help others recognize the spot</div>
              </div>
            </label>

            <input id="photo" name="photo" class="input-hidden" type="file" accept="image/*" aria-describedby="fileMeta">
            <div id="fileMeta" class="file-meta" aria-live="polite">No file chosen</div>
          </div>
        </div>

        <div class="row">
          <div style="flex:1 1 100%">
            <label>Preview</label>
            <div class="photo-preview" id="photoPreview" aria-live="polite">
              <span class="preview-placeholder">No Photo</span>
              <img id="previewImage" alt="preview" style="display:none;">
              <button class="crop-toggle" id="openCropBtn" type="button" style="display:none">Crop</button>

              <div class="cropper-root" id="cropperRoot" aria-hidden="true">
                <div class="cropper-stage" role="dialog" aria-modal="true">
                  <div class="cropper-preview" id="cropperPreview">
                    <img id="cropperImage" alt="cropper source" style="max-width:100%;display:block">
                  </div>

                  <!-- Cropper controls with size presets and custom inputs -->
                  <div class="cropper-controls" style="display:flex;align-items:center;gap:12px;margin-top:12px;">
                    <div class="crop-size-controls" style="display:flex;gap:8px;align-items:center;">
                      <label for="cropPreset" style="font-weight:700;color:#333;margin-right:6px">Size</label>
                      <select id="cropPreset" aria-label="Crop preset" style="padding:8px;border-radius:8px;border:1px solid #e6e6e6">
                        <option value="free">Free</option>
                        <option value="square">Square (1:1)</option>
                        <option value="4-3">4:3</option>
                        <option value="16-9">16:9</option>
                        <option value="custom">Custom</option>
                      </select>

                      <div id="customSizeInputs" style="display:none;gap:6px;align-items:center;margin-left:8px;">
                        <input id="customWidth" type="number" min="16" placeholder="W px" style="width:84px;padding:8px;border-radius:8px;border:1px solid #e6e6e6">
                        <span style="color:#666">×</span>
                        <input id="customHeight" type="number" min="16" placeholder="H px" style="width:84px;padding:8px;border-radius:8px;border:1px solid #e6e6e6">
                      </div>
                    </div>

                    <div style="flex:1"></div>

                    <div class="cropper-controls-actions" style="display:flex;gap:8px;align-items:center;">
                      <button class="cropper-btn ghost" id="cancelCropBtn" type="button">Cancel</button>
                      <button class="cropper-btn ghost" id="rotateLeftBtn" type="button">⟲</button>
                      <button class="cropper-btn ghost" id="rotateRightBtn" type="button">⟳</button>
                      <button class="cropper-btn primary" id="saveCropBtn" type="button">Save Crop</button>
                    </div>
                  </div>
                  <!-- end cropper-controls -->

                </div>
              </div>
            </div>

            <div class="small" style="margin-top:8px">Tip: images are resized client-side to avoid storage limits.</div>
          </div>

          <div style="flex:1 1 40%;display:flex;flex-direction:column;justify-content:flex-end;gap:8px">
            <div class="actions">
  <button type="submit" class="btn primary" id="submitBtn">Submit Spot</button>

  <!-- Inline Crop button (hidden until an image is uploaded) -->
  <button type="button" class="btn crop-inline" id="cropInlineBtn" style="display:none">Crop</button>

  <button type="button" class="btn ghost" id="clearBtn">Clear</button>
</div>
        </div>
      </form>
    </section>

    <section id="confirmationCard" class="card" aria-hidden="true">
      <div class="confirmation" role="status" aria-live="polite">
        <div class="thumb" id="confirmThumb">No Photo</div>
        <div class="meta">
          <h4 id="confirmName">Spot submitted</h4>
          <p id="confirmLocation" class="small">Location</p>
          <p id="confirmDesc" class="small" style="margin-top:8px;color:#444"></p>
          <div style="margin-top:10px;display:flex;gap:8px">
            <a id="viewSpotsBtn" href="spots.html" class="btn primary">View on Spots</a>
            <button id="addAnotherBtn" class="btn ghost">Add another</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>© <span id="year"></span> StudySpot</footer>

  <!-- Cropper.js -->
  <script src="https://unpkg.com/cropperjs/dist/cropper.min.js"></script>

  <!-- Your existing JS (no changes required) -->
  <script src="suggest.js"></script>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

  <script>
  (function () {
    const STORAGE_KEY = 'studysite_suggestions_v1';
    const form = document.getElementById('suggestForm');
    const placeName = document.getElementById('placeName');
    const locationInput = document.getElementById('location');
    const description = document.getElementById('description');
    const photoInput = document.getElementById('photo');
    const formMessage = document.getElementById('formMessage');
    const clearBtn = document.getElementById('clearBtn');
    const photoPreview = document.getElementById('photoPreview');
    const fileMeta = document.getElementById('fileMeta');

    const confirmationCard = document.getElementById('confirmationCard');
    const confirmThumb = document.getElementById('confirmThumb');
    const confirmName = document.getElementById('confirmName');
    const confirmLocation = document.getElementById('confirmLocation');
    const confirmDesc = document.getElementById('confirmDesc');
    const addAnotherBtn = document.getElementById('addAnotherBtn');
    const viewSpotsBtn = document.getElementById('viewSpotsBtn');

    // Resize image client-side to avoid localStorage quota issues
    async function fileToResizedDataURL(file, maxWidth = 1200, quality = 0.8) {
      if (!file) return null;
      // Only process images
      if (!file.type.startsWith('image/')) return null;
      const img = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => {
          const i = new Image();
          i.onload = () => res(i);
          i.onerror = rej;
          i.src = reader.result;
        };
        reader.onerror = rej;
        reader.readAsDataURL(file);
      }).catch(() => null);
      if (!img) return null;
      const ratio = img.width / img.height;
      const width = Math.min(maxWidth, img.width);
      const height = Math.round(width / ratio);
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      return canvas.toDataURL('image/jpeg', quality);
    }

    // get selected tags
    function getSelectedTags() {
      return Array.from(document.querySelectorAll('input[name="tags"]:checked')).map(i => i.value);
    }

    // get safety
    function getSafety() {
      const r = document.querySelector('input[name="safety"]:checked');
      return r ? r.value : 'Safe';
    }

    // sanitize for display in attributes
    function sanitize(s) {
      return String(s || '').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }

    // show preview when user selects a photo
    photoInput.addEventListener('change', async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) {
        photoPreview.innerHTML = 'No Photo';
        fileMeta.textContent = 'No file chosen';
        return;
      }
      fileMeta.textContent = `${file.name} • ${(file.size/1024|0)} KB`;
      // quick size guard
      if (file.size > 2_500_000) { // ~2.5MB original
        formMessage.textContent = 'Large image detected. It will be resized automatically.';
        formMessage.className = 'msg';
        formMessage.style.color = '#b45a00';
      } else {
        formMessage.textContent = '';
        formMessage.className = '';
      }
      const data = await fileToResizedDataURL(file, 1200, 0.8);
      if (data) {
        photoPreview.innerHTML = '<img alt="photo preview" src="' + sanitize(data) + '">';
      } else {
        photoPreview.textContent = 'No Photo';
      }
    });

    // save suggestion
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMessage.textContent = '';
      formMessage.className = '';

      // validation
      if (!placeName.value.trim()) {
        formMessage.textContent = 'Please enter the place name.';
        formMessage.className = 'msg error';
        placeName.focus();
        return;
      }
      if (!locationInput.value.trim()) {
        formMessage.textContent = 'Please enter the location.';
        formMessage.className = 'msg error';
        locationInput.focus();
        return;
      }
      if (!description.value.trim()) {
        formMessage.textContent = 'Please add a short description.';
        formMessage.className = 'msg error';
        description.focus();
        return;
      }

      // read and resize photo (if any)
      const file = photoInput.files && photoInput.files[0];
      let photoData = null;
      if (file) {
        photoData = await fileToResizedDataURL(file, 1200, 0.8);
      }

      const suggestion = {
        id: 'sugg_' + Date.now(),
        name: placeName.value.trim(),
        location: locationInput.value.trim(),
        description: description.value.trim(),
        tags: getSelectedTags(),
        safety: getSafety(),
        photo: photoData,
        submittedAt: new Date().toISOString()
      };

      // load existing
      let list = [];
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        list = raw ? JSON.parse(raw) : [];
      } catch (err) {
        list = [];
      }

      list.push(suggestion);

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        // small helper flag and custom event so Spots page can react immediately
        localStorage.setItem('studysite_last_submitted', suggestion.id);
        window.dispatchEvent(new CustomEvent('suggestion:added', { detail: suggestion }));
      } catch (err) {
        formMessage.textContent = 'Could not save suggestion. Image may be too large for local storage.';
        formMessage.className = 'msg error';
        return;
      }

      // show confirmation card
      confirmName.textContent = suggestion.name;
      confirmLocation.textContent = suggestion.location;
      confirmDesc.textContent = suggestion.description;
      if (suggestion.photo) {
        confirmThumb.innerHTML = '<img src="' + sanitize(suggestion.photo) + '" alt="' + sanitize(suggestion.name) + '">';
      } else {
        confirmThumb.textContent = 'No Photo';
      }
      confirmationCard.style.display = 'block';
      confirmationCard.setAttribute('aria-hidden','false');
      document.getElementById('formCard').style.display = 'none';
      formMessage.textContent = '';
      formMessage.className = '';

      // focus the confirmation for screen readers
      confirmName.focus?.();
    });

    // clear form
    clearBtn.addEventListener('click', () => {
      form.reset();
      photoPreview.innerHTML = 'No Photo';
      fileMeta.textContent = 'No file chosen';
      formMessage.textContent = '';
      formMessage.className = '';
      placeName.focus();
    });

    // add another
    addAnotherBtn.addEventListener('click', () => {
      confirmationCard.style.display = 'none';
      confirmationCard.setAttribute('aria-hidden','true');
      document.getElementById('formCard').style.display = '';
      form.reset();
      photoPreview.innerHTML = 'No Photo';
      fileMeta.textContent = 'No file chosen';
      placeName.focus();
    });

    const image = document.getElementById('imageToCrop');
  const cropper = new Cropper(image, {
    aspectRatio: 16 / 9,
    viewMode: 1,
    movable: true,
    zoomable: true,
    scalable: true,
    crop(event) {
      console.log(event.detail.x, event.detail.y, event.detail.width, event.detail.height);
    },
  });

    // set year in footer
    document.getElementById('year').textContent = new Date().getFullYear();

    // focus first input on load
    window.addEventListener('DOMContentLoaded', () => {
      placeName.focus();
    });
  })();
  

  (function () {
      // Elements
      const fileInput = document.getElementById('photo');
      const fileMeta = document.getElementById('fileMeta');
      const previewImage = document.getElementById('previewImage');
      const previewWrapper = document.getElementById('photoPreview');
      const placeholder = previewWrapper.querySelector('.preview-placeholder');
      const openCropBtn = document.getElementById('openCropBtn');
      const cropperRoot = document.getElementById('cropperRoot');
      const cropperImage = document.getElementById('cropperImage');
      const saveCropBtn = document.getElementById('saveCropBtn');
      const cancelCropBtn = document.getElementById('cancelCropBtn');
      const rotateLeftBtn = document.getElementById('rotateLeftBtn');
      const rotateRightBtn = document.getElementById('rotateRightBtn');

      const suggestForm = document.getElementById('suggestForm');
      const clearBtn = document.getElementById('clearBtn');
      const formMessage = document.getElementById('formMessage');

      const confirmationCard = document.getElementById('confirmationCard');
      const confirmThumb = document.getElementById('confirmThumb');
      const confirmName = document.getElementById('confirmName');
      const confirmLocation = document.getElementById('confirmLocation');
      const confirmDesc = document.getElementById('confirmDesc');
      const addAnotherBtn = document.getElementById('addAnotherBtn');

      let cropper = null;
      let currentDataUrl = ''; // holds the final (possibly cropped) data URL

      function resetPreview() {
        previewImage.style.display = 'none';
        previewImage.src = '';
        placeholder.style.display = 'flex';
        openCropBtn.style.display = 'none';
        fileMeta.textContent = 'No file chosen';
        currentDataUrl = '';
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }
        cropperRoot.classList.remove('active');
        cropperRoot.setAttribute('aria-hidden', 'true');
      }

      // Inline crop button wiring
const cropInlineBtn = document.getElementById('cropInlineBtn');

// Show inline crop button when an image is loaded (call after previewImage.src is set)
function showInlineCropButton() {
  if (cropInlineBtn) cropInlineBtn.style.display = 'inline-block';
}

// Hide inline crop button
function hideInlineCropButton() {
  if (cropInlineBtn) cropInlineBtn.style.display = 'none';
}

// Ensure the inline button opens the same crop overlay
if (cropInlineBtn) {
  cropInlineBtn.addEventListener('click', () => {
    // Reuse existing openCropBtn behavior if present
    const openBtn = document.getElementById('openCropBtn');
    if (openBtn) {
      openBtn.click();
      return;
    }

    // Fallback: open overlay and init cropper directly
    if (!cropperImage || !cropperRoot) return;
    cropperRoot.classList.add('active');
    cropperRoot.setAttribute('aria-hidden','false');
    if (cropper) cropper.destroy();
    cropperImage.onload = () => {
      cropper = new Cropper(cropperImage, {
        viewMode: 1,
        autoCropArea: 0.9,
        movable: true,
        zoomable: true,
        scalable: true,
        rotatable: true,
        responsive: true,
        background: false,
        aspectRatio: NaN
      });
    };
    if (cropperImage.complete) cropperImage.onload();
  });
}

// Call showInlineCropButton() after you set previewImage.src in your file input handler
// Example: after previewImage.src = url; add showInlineCropButton();

// Hide inline button on clear/reset
if (clearBtn) {
  const origClear = clearBtn.onclick;
  clearBtn.addEventListener('click', () => {
    hideInlineCropButton();
  });
}


      // File input change
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) {
          resetPreview();
          return;
        }

        // Basic file type check
        if (!file.type.startsWith('image/')) {
          fileMeta.textContent = 'Please choose an image file';
          return;
        }

        fileMeta.textContent = `${file.name} - ${Math.round(file.size / 1024)} KB`;

        const reader = new FileReader();
        reader.onload = function (evt) {
          const url = evt.target.result;
          // show preview image
          previewImage.src = url;
          previewImage.style.display = 'block';
          placeholder.style.display = 'none';
          openCropBtn.style.display = 'inline-block';
          // set cropper source
          cropperImage.src = url;
          currentDataUrl = url; // initial (uncropped) image
        };
        reader.readAsDataURL(file);
      });

      // Open crop overlay
      openCropBtn.addEventListener('click', () => {
        cropperRoot.classList.add('active');
        cropperRoot.setAttribute('aria-hidden', 'false');

        if (cropper) cropper.destroy();

        // ensure image is loaded before initializing cropper
        cropperImage.onload = () => {
          cropper = new Cropper(cropperImage, {
            viewMode: 1,
            autoCropArea: 0.9,
            movable: true,
            zoomable: true,
            scalable: true,
            rotatable: true,
            responsive: true,
            background: false,
            aspectRatio: NaN // free ratio; set a number for fixed ratio
          });
        };

        if (cropperImage.complete) cropperImage.onload();
      });

      // Cancel crop
      cancelCropBtn.addEventListener('click', () => {
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }
        cropperRoot.classList.remove('active');
        cropperRoot.setAttribute('aria-hidden', 'true');
      });

      // Rotate controls
      rotateLeftBtn.addEventListener('click', () => { if (cropper) cropper.rotate(-90); });
      rotateRightBtn.addEventListener('click', () => { if (cropper) cropper.rotate(90); });

      // Save crop
      saveCropBtn.addEventListener('click', () => {
        if (!cropper) return;
        const canvas = cropper.getCroppedCanvas({
          maxWidth: 1600,
          maxHeight: 1200,
          imageSmoothingQuality: 'high'
        });
        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        previewImage.src = dataUrl;
        previewImage.style.display = 'block';
        placeholder.style.display = 'none';
        openCropBtn.style.display = 'inline-block';
        currentDataUrl = dataUrl; // store final cropped image
        cropper.destroy();
        cropper = null;
        cropperRoot.classList.remove('active');
        cropperRoot.setAttribute('aria-hidden', 'true');
      });

      // Clear button
      clearBtn.addEventListener('click', () => {
        suggestForm.reset();
        resetPreview();
        formMessage.textContent = '';
      });

      // Form submit: save suggestion to localStorage and show confirmation
      suggestForm.addEventListener('submit', (e) => {
        e.preventDefault();
        formMessage.textContent = '';

        const name = document.getElementById('placeName').value.trim();
        const loc = document.getElementById('location').value.trim();
        const desc = document.getElementById('description').value.trim();

        if (!name || !loc) {
          formMessage.textContent = 'Please fill in the place name and location.';
          return;
        }

        // collect tags
        const tagEls = Array.from(document.querySelectorAll('input[name="tags"]:checked'));
        const tags = tagEls.map(i => i.value);

        // safety
        const safetyEl = document.querySelector('input[name="safety"]:checked');
        const safety = safetyEl ? safetyEl.value : 'Safe';

        // Build suggestion object
        const suggestion = {
          id: 's_' + Date.now(),
          name,
          location: loc,
          description: desc,
          tags,
          safety,
          photoDataUrl: currentDataUrl || '' ,
          createdAt: new Date().toISOString()
        };

        // Save to localStorage (append to array)
        try {
          const key = 'studyspot_suggestions';
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          existing.push(suggestion);
          localStorage.setItem(key, JSON.stringify(existing));
        } catch (err) {
          console.error('Storage error', err);
          formMessage.textContent = 'Could not save suggestion locally.';
          return;
        }

        // Show confirmation card
        confirmName.textContent = suggestion.name;
        confirmLocation.textContent = suggestion.location;
        confirmDesc.textContent = suggestion.description || '';
        if (suggestion.photoDataUrl) {
          confirmThumb.innerHTML = '';
          const img = document.createElement('img');
          img.src = suggestion.photoDataUrl;
          img.alt = suggestion.name + ' photo';
          img.className = 'cropped-thumb';
          confirmThumb.appendChild(img);
        } else {
          confirmThumb.textContent = 'No Photo';
        }

        // Hide form, show confirmation
        document.getElementById('formCard').style.display = 'none';
        confirmationCard.style.display = 'block';
        confirmationCard.setAttribute('aria-hidden', 'false');

        // Reset form state for next time
        suggestForm.reset();
        resetPreview();
      });

      // Add another: return to form
      addAnotherBtn.addEventListener('click', () => {
        confirmationCard.style.display = 'none';
        confirmationCard.setAttribute('aria-hidden', 'true');
        document.getElementById('formCard').style.display = 'block';
        document.getElementById('placeName').focus();
      });

      // Expose clearPhoto for external use if needed
      window.clearPhoto = resetPreview;

      // Initialize: ensure preview is reset on load
      resetPreview();
    })();
  </script>
  <!-- Cropper.js -->
<script src="https://unpkg.com/cropperjs/dist/cropper.min.js"></script>

<!-- Your integration script (either inline or external file) -->
<script src="suggest.js"></script>

</body>
</html>
