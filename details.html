<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Study Hall - StudySpot</title>
  <link rel="stylesheet" href="style.css">   <!-- your global styles -->
  <link rel="stylesheet" href="details.css"> <!-- details page styles -->
</head>

<body>
  <header>
    <div class="logo-container">
      <img src="StudySpot.png" alt="StudySpot Logo">
      <h2><span class="green-text">Study</span>Spot</h2>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="spots.html" class="active">Spots</a>
      <a href="suggest.html">Suggest</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- Details Section -->
  <section class="details">
    <div class="details-header">
      <div class="image-wrapper">
        <img src="image/Library.png" alt="Library Study Hall" class="details-img">
        <a href="spots.html" class="back-btn">← Back to Spots</a>
      </div>

      <div class="details-info">
        <h2>Library Study Hall</h2>
        <p class="rating">★★★★☆ 4.7 (98 reviews)</p>
        <div class="tags">
          <span class="tag">Quiet</span>
          <span class="tag">Wi‑Fi</span>
          <span class="tag">Safe</span>
        </div>
        <p class="description">
          A quiet and comfortable study area inside the main library. Perfect for focused studying.
        </p>
        <!-- Info cards: Safety Level and Best Time -->
<div class="info-grid" role="group" aria-label="Spot info">
  <div class="info-card" id="info-safety" aria-live="polite">
    <div class="info-icon" aria-hidden="true">
      <!-- shield icon -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2l7 3v5c0 5-3.5 9.7-7 11-3.5-1.3-7-6-7-11V5l7-3z" fill="#E6F9E6"/>
        <path d="M10 12l2 2 4-4" stroke="#1B5E20" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="info-body">
      <div class="info-label">Safety Level</div>
      <div class="info-value" id="info-safety-value">Safe</div>
    </div>
  </div>

  <div class="info-card" id="info-besttime" aria-live="polite">
    <div class="info-icon" aria-hidden="true">
      <!-- sun icon -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="#FFF7E6"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="info-body">
      <div class="info-label">Best Time</div>
      <div class="info-value" id="info-besttime-value">Morning / Afternoon</div>
    </div>
  </div>
</div>
      </div>
    </div>


  <!-- Review Form (interactive) -->
    <div class="review-form">
      <h3>Rate this spot</h3>

      <!-- interactive stars -->
      <div class="stars" id="starRating" role="radiogroup" aria-label="Rate this spot">
        <button class="star" data-value="1" aria-label="1 star" aria-checked="false">☆</button>
        <button class="star" data-value="2" aria-label="2 stars" aria-checked="false">☆</button>
        <button class="star" data-value="3" aria-label="3 stars" aria-checked="false">☆</button>
        <button class="star" data-value="4" aria-label="4 stars" aria-checked="false">☆</button>
        <button class="star" data-value="5" aria-label="5 stars" aria-checked="false">☆</button>
      </div>

      <textarea id="reviewText" placeholder="Write your review..." rows="4"></textarea>

      <div class="review-actions">
        <input id="reviewerName" type="text" placeholder="Your name (optional)" />
        <button id="submitReview" class="btn">Submit Review</button>
      </div>
    </div>

    <!-- Reviews Section -->
    <div class="reviews-section">
      <h3>Recent Reviews</h3>

      <!-- Existing static reviews are now seeded by JS if needed -->
    </div>
  </section>

  <script>
/* Helper: sanitize text to avoid HTML injection */
function sanitize(str) {
  return String(str || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

/* Get spot id from URL or default */
const params = new URLSearchParams(window.location.search);
const spotId = params.get('id') || 'library';

/* Spot data */
const spots = {
  library: {
    title: "Library Study Hall",
    rating: "★★★★☆ 4.7 (98 reviews)",
    tags: ["Quiet", "Wi‑Fi", "Safe"],
    description: "A quiet and comfortable study area inside the main library. Perfect for focused studying.",
    safety: "Safe",
    bestTime: "Morning / Afternoon",
    image: "image/Library.png"
  },
  cafe: {
    title: "Café Study Corner",
    rating: "★★★★☆ 4.5 (76 reviews)",
    tags: ["Wi‑Fi", "Affordable"],
    description: "A cozy café with good coffee and reliable Wi‑Fi.",
    safety: "Safe",
    bestTime: "Afternoon / Evening",
    image: "image/Cafe.png"
  },
  park: {
    title: "Park Study Area",
    rating: "★★★☆☆ 3.9 (54 reviews)",
    tags: ["Quiet", "Affordable"],
    description: "An outdoor study spot with fresh air and natural light.",
    safety: "Moderate",
    bestTime: "Morning",
    image: "image/Park.png"
  }
};

/* Default seeded reviews (used only if localStorage empty) */
const defaultReviews = {
  library: [
    { name: "Aira M.", text: "Very quiet and clean! I love studying here.", date: "March 10, 2024", rating: 5 },
    { name: "John D.", text: "Good wifi and lots of seats.", date: "March 8, 2024", rating: 5 },
    { name: "Nicole P.", text: "Perfect for reviewing and reading.", date: "March 5, 2024", rating: 5 }
  ],
  cafe: [],
  park: []
};

/* LocalStorage key per spot */
const storageKey = 'studysite_reviews_' + spotId;

/* DOM refs */
const detailsImg = document.querySelector('.details-img');
const detailsTitle = document.querySelector('.details-info h2');
const detailsRating = document.querySelector('.details-info .rating');
const tagsContainer = document.querySelector('.details-info .tags');
const descriptionEl = document.querySelector('.details-info .description');
const safetyEl = document.querySelector('.details-info .safety');
const besttimeEl = document.querySelector('.details-info .besttime');

const stars = Array.from(document.querySelectorAll('.star'));
const reviewText = document.getElementById('reviewText');
const reviewerName = document.getElementById('reviewerName');
const submitBtn = document.getElementById('submitReview');
const reviewsSection = document.querySelector('.reviews-section');

let currentRating = 0;

/* Populate page for the spot */
function populateSpot() {
  const spot = spots[spotId] || spots['library'];
  if (detailsImg) detailsImg.src = spot.image;
  if (detailsTitle) detailsTitle.textContent = spot.title;
  // rating text will be computed from stored reviews
  tagsContainer.innerHTML = '';
  spot.tags.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.textContent = tag;
    tagsContainer.appendChild(span);
  });
  if (descriptionEl) descriptionEl.textContent = spot.description;
  if (safetyEl) safetyEl.innerHTML = `<strong>Safety Level:</strong> ${spot.safety}`;
  if (besttimeEl) besttimeEl.innerHTML = `<strong>Best Time:</strong> ${spot.bestTime}`;
}

  /* Update the new info cards dynamically */
function updateInfoCardsFromSpot() {
  try {
    const spot = spots[spotId] || spots['library'];
    const safetyEl = document.getElementById('info-safety-value');
    const bestEl = document.getElementById('info-besttime-value');
    const safetyCard = document.getElementById('info-safety');

    if (spot && safetyEl && bestEl) {
      const safetyText = spot.safety || 'Safe';
      const bestText = spot.bestTime || 'Morning / Afternoon';
      safetyEl.textContent = safetyText;
      bestEl.textContent = bestText;

      // color the safety icon background by level
      if (safetyCard) {
        const icon = safetyCard.querySelector('.info-icon');
        if (safetyText.toLowerCase() === 'safe') {
          icon.style.background = 'linear-gradient(180deg,#E6F9E6,#CFF0D6)';
        } else if (safetyText.toLowerCase() === 'moderate') {
          icon.style.background = 'linear-gradient(180deg,#FFF7E6,#FFECCF)';
        } else {
          icon.style.background = 'linear-gradient(180deg,#FFE6E6,#FFD6D6)';
        }
      }
    }
  } catch (e) {
    // fail silently
  }
}


/* Load reviews from localStorage or seed defaults */
function loadReviews() {
  const raw = localStorage.getItem(storageKey);
  let reviews = [];
  try {
    reviews = raw ? JSON.parse(raw) : null;
  } catch (e) {
    reviews = null;
  }
  if (!reviews) {
    reviews = defaultReviews[spotId] ? defaultReviews[spotId].slice() : [];
    localStorage.setItem(storageKey, JSON.stringify(reviews));
  }
  return reviews;
}

/* Save reviews */
function saveReviews(reviews) {
  localStorage.setItem(storageKey, JSON.stringify(reviews));
}

/* Compute average rating and update the .rating text */
function computeAndShowRating(reviews) {
  if (!Array.isArray(reviews)) reviews = [];
  const total = reviews.length;
  const sum = reviews.reduce((acc, r) => acc + (Number(r.rating) || 0), 0);
  const avg = total ? (sum / total) : 0;
  const rounded = Math.round(avg * 10) / 10; // one decimal
  const wholeStars = Math.round(avg); // visual nearest whole star
  const starStr = '★'.repeat(wholeStars) + '☆'.repeat(5 - wholeStars);
  if (detailsRating) detailsRating.textContent = `${starStr} ${rounded} (${total} review${total !== 1 ? 's' : ''})`;
}

/* Render reviews (newest first) */
function renderReviews(reviews) {
  const heading = reviewsSection.querySelector('h3');
  reviewsSection.innerHTML = '';
  if (heading) reviewsSection.appendChild(heading);
  reviews.slice().reverse().forEach(r => {
    const div = document.createElement('div');
    div.className = 'review';
    div.innerHTML = `
      <p class="meta"><strong>${sanitize(r.name || 'Anonymous')}</strong> — ${sanitize(r.date)} • ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</p>
      <p class="text">${sanitize(r.text)}</p>
    `;
    reviewsSection.appendChild(div);
  });
}

/* Star visuals */
function updateStarVisuals(value) {
  stars.forEach(s => {
    const v = Number(s.dataset.value);
    s.classList.toggle('selected', v <= value);
    s.setAttribute('aria-checked', v === value ? 'true' : 'false');
    s.textContent = v <= value ? '★' : '☆';
  });
}

/* Star interactions */
stars.forEach(s => {
  s.addEventListener('mouseenter', () => {
    const v = Number(s.dataset.value);
    stars.forEach(st => st.classList.toggle('hovered', Number(st.dataset.value) <= v));
    stars.forEach(st => st.textContent = Number(st.dataset.value) <= v ? '★' : '☆');
  });
  s.addEventListener('mouseleave', () => {
    stars.forEach(st => st.classList.remove('hovered'));
    updateStarVisuals(currentRating);
  });
  s.addEventListener('click', () => {
    currentRating = Number(s.dataset.value);
    updateStarVisuals(currentRating);
  });
  s.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      currentRating = Number(s.dataset.value);
      updateStarVisuals(currentRating);
    }
  });
});

/* Submit review handler: saves review, recomputes average, updates UI */
submitBtn.addEventListener('click', () => {
  const text = reviewText.value.trim();
  if (!text) {
    reviewText.focus();
    return;
  }
  const name = reviewerName.value.trim() || 'Anonymous';
  const date = new Date().toLocaleDateString();
  const rating = currentRating || 5;

  const review = { name, text, date, rating };

  // Load existing, append, save
  let reviews = loadReviews();
  reviews.push(review);
  saveReviews(reviews);

  // Clear form
  reviewText.value = '';
  reviewerName.value = '';
  currentRating = 0;
  updateStarVisuals(0);

  // Update UI
  computeAndShowRating(reviews);
  renderReviews(reviews);
});

/* Initialize page */
populateSpot();
updateInfoCardsFromSpot();            // ← NEW: update the Safety / Best Time cards
const initialReviews = loadReviews();
computeAndShowRating(initialReviews);
renderReviews(initialReviews);
updateStarVisuals(0);

  </script>
</body>
</html>
